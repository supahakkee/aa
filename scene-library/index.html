<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- @artifact-start -->
<title>Set-Piece Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: edit bay. A faceted filter rail on the left, a contact sheet of 30-second clips, a viewer on top. */
:root {
  --bg: #0c0f13;
  --panel: #141920;
  --raise: #1c232c;
  --line: #29313c;
  --fg: #ece7dd;
  --muted: #949ca8;
  --faint: #636c78;
  --accent: #f0b24a;
  --accent-ink: #1b1306;
  --on-scrim: #f4f0e7;
  --scrim: rgba(7, 9, 12, 0.78);
  --fight: #e47b61;
  --battle: #b8ad8c;
  --pursuit: #94c57f;
  --spectacle: #c993dc;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceef1; --panel: #ffffff; --raise: #f4f5f7; --line: #d4d8de;
    --fg: #14181e; --muted: #56606c; --faint: #858d98;
    --accent: #a5630a; --accent-ink: #fff9ee;
    --fight: #b5462e; --battle: #75693f; --pursuit: #44822f; --spectacle: #87449f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceef1; --panel: #ffffff; --raise: #f4f5f7; --line: #d4d8de;
  --fg: #14181e; --muted: #56606c; --faint: #858d98;
  --accent: #a5630a; --accent-ink: #fff9ee;
  --fight: #b5462e; --battle: #75693f; --pursuit: #44822f; --spectacle: #87449f;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1720px;
  margin: 0 auto;
  padding-inline: clamp(16px, 3vw, 40px);
  padding-block: 12px;
  display: flex;
  align-items: center;
  gap: 12px 24px;
  flex-wrap: wrap;
}
.mark { display: flex; flex-direction: column; text-decoration: none; min-width: 0; }
.mark-name { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 0.95; letter-spacing: 0.04em; text-transform: uppercase; }
.mark-name b { color: var(--accent); font-weight: 800; }
.mark-sub { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
.search {
  flex: 1 1 320px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding-inline: 12px;
  min-width: 0;
}
.search:focus-within { border-color: var(--accent); }
.search svg { flex: none; color: var(--faint); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding-block: 10px; outline: none; }
.search kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius);
  padding: 8px 14px;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { border-color: var(--faint); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { border-color: var(--fg); }
.btn .count { font-family: var(--mono); font-size: 11px; background: var(--raise); color: var(--fg); border-radius: 10px; padding: 0 7px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.filters-btn { display: none; }

.hint { max-width: 1720px; margin: 12px auto 0; padding-inline: clamp(16px, 3vw, 40px); }
.hint p { margin: 0; border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 14px; color: var(--muted); font-size: 13px; }
.hint code { font-family: var(--mono); color: var(--fg); }

/* Page grid */
.app {
  max-width: 1720px;
  margin: 0 auto;
  padding-inline: clamp(16px, 3vw, 40px);
  padding-block: 20px 64px;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 32px;
}

/* Filter rail */
.side {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 84px);
  align-self: start;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 16px;
  scrollbar-width: thin;
}
.side-head { display: none; }
.rail-title { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); padding-inline: 8px; }
.tree { display: flex; flex-direction: column; gap: 10px; }
.fam { display: flex; flex-direction: column; gap: 1px; }
.fam-head {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  border: 0; background: none; border-radius: 4px; padding: 4px 8px;
  font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--g); text-align: left;
}
.fam-head span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.fam-head span:first-child::before { content: ""; width: 8px; height: 8px; background: var(--g); border-radius: 1px; }
.fam-head[aria-pressed="true"] { background: var(--panel); box-shadow: inset 2px 0 0 var(--g); }
.fv {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  border: 0; background: none; border-radius: 4px; padding: 4px 8px 4px 24px;
  text-align: left; color: var(--muted); font-size: 14px; line-height: 1.35; width: 100%;
}
.fv:hover { color: var(--fg); background: var(--panel); }
.fv .n { font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none; }
.fv[aria-pressed="true"] { color: var(--fg); background: var(--panel); box-shadow: inset 2px 0 0 var(--g, var(--accent)); }
.fv.zero { opacity: 0.4; }
.fv-all { padding-left: 8px; font-weight: 600; color: var(--fg); --g: var(--accent); }
details.facet { border-top: 1px solid var(--line); padding-top: 8px; }
details.facet summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 14px;
}
details.facet summary::-webkit-details-marker { display: none; }
details.facet summary::after { content: "+"; font-family: var(--mono); color: var(--faint); }
details.facet[open] summary::after { content: "−"; }
details.facet summary .sel { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-left: auto; margin-right: 10px; }
details.facet .fv { padding-left: 12px; }
.more { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 12px; text-align: left; }

/* Results */
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.status { display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.status h1 {
  margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 4vw, 44px);
  line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance;
}
.status .meta { color: var(--muted); }
.status .spacer { flex: 1; }
.select { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 6px 10px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.active { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 4px 11px; font-size: 13px; color: var(--muted); white-space: nowrap;
}
.chip:hover { color: var(--fg); border-color: var(--faint); }
.chip b { font-weight: 500; color: var(--faint); }
.chip.on { color: var(--fg); border-color: var(--accent); }
.chip .x { font-family: var(--mono); color: var(--faint); }

/* Contact sheet */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 236px), 1fr)); gap: 26px 18px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.thumb {
  position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  border: 0; padding: 0; border-radius: var(--radius); overflow: hidden; background: var(--raise);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease, filter 0.35s ease; }
.thumb:hover img { transform: scale(1.04); filter: brightness(0.82); }
.thumb::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); border-radius: inherit; }
.tag, .tc, .disk, .canon {
  position: absolute; display: inline-flex; align-items: center; gap: 6px;
  background: var(--scrim); color: var(--on-scrim); border-radius: 3px; padding: 2px 7px;
}
.tag { left: 8px; top: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
.tag i { width: 7px; height: 7px; background: var(--g); border-radius: 1px; }
.tc { right: 8px; bottom: 8px; font-size: 11px; font-variant-numeric: tabular-nums; }
.disk { left: 8px; bottom: 8px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
.canon { right: 8px; top: 8px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); }
.pick { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
.pick.hot { background: currentColor; }
.play-ico {
  position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  opacity: 0; transform: scale(0.85); transition: opacity 0.2s ease, transform 0.2s ease;
}
.thumb:hover .play-ico, .thumb:focus-visible .play-ico { opacity: 1; transform: scale(1); }
.card-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.film { margin: 0; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em; overflow-wrap: anywhere; }
.film .yr { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 4px; vertical-align: 2px; }
.scene { margin: 2px 0 0; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.period { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.feel { margin: 2px 0 0; color: var(--faint); font-size: 12px; overflow-wrap: anywhere; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; min-height: 30px; }
.award { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; min-width: 0; }
.award span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.star {
  flex: none; margin-left: auto; border: 1px solid var(--line); background: none; border-radius: 50%;
  width: 30px; height: 30px; display: grid; place-items: center; color: var(--faint);
}
.star:hover { color: var(--fg); border-color: var(--faint); }
.star[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.star[aria-pressed="true"] svg path { fill: currentColor; }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--muted); }

/* Viewer */
dialog.viewer {
  width: min(1320px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); overflow: auto;
}
dialog.viewer::backdrop { background: rgba(4, 6, 9, 0.82); backdrop-filter: blur(3px); }
.v-wrap { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.v-stage { background: #000; display: flex; flex-direction: column; min-width: 0; }
.screen { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; }
.screen iframe, .screen video, .screen > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.screen video { background: #000; }
.poster { display: block; text-decoration: none; color: var(--on-scrim); }
.poster img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; display: block; }
.poster .cta { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.poster .cta b { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 12px 22px; font-weight: 600; }
.poster .cta span { background: var(--scrim); border-radius: 4px; padding: 3px 8px; }
.screen-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 24px; text-align: center; background: #0a0c0f; color: #ece7dd;
}
.screen-msg .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.screen-msg .btn { background: #1c232c; border-color: #3a4350; color: #ece7dd; }
.transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; background: #0b0d10; color: #ece7dd; }
.transport .btn { background: #161b22; border-color: #2c3440; color: #ece7dd; padding: 6px 11px; font-size: 13px; }
.transport .btn:hover { border-color: #6b7480; }
.transport .btn[aria-pressed="true"] { border-color: #f0b24a; color: #f0b24a; }
.transport .grow { flex: 1; }
.transport .reel { font-family: var(--mono); font-size: 11px; color: #f0b24a; letter-spacing: 0.08em; }
.timeline { padding: 4px 14px 14px; background: #0b0d10; color: #949ca8; }
.timeline svg { display: block; width: 100%; height: 38px; }
.timeline .tl-labels { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-variant-numeric: tabular-nums; }
.timeline .tl-labels b { color: #f0b24a; font-weight: 500; }

.v-info { padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.v-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.v-tag { display: inline-flex; align-items: center; gap: 7px; color: var(--g); text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; }
.v-tag i { width: 8px; height: 8px; background: var(--g); border-radius: 1px; }
.v-close { border: 1px solid var(--line); background: none; border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; flex: none; color: var(--muted); }
.v-close:hover { color: var(--fg); border-color: var(--faint); }
.v-title { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.v-film { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; }
.v-film .yr { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; letter-spacing: 0; vertical-align: 4px; }
.v-sub { margin: 0; color: var(--muted); }
.v-sec h4 { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
.v-sec p { margin: 0; max-width: 62ch; }
.v-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.v-list.awards li { color: var(--accent); }
.v-list.awards li::before { content: "◆ "; font-size: 9px; vertical-align: 2px; }
.facets { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.facets dt { font-family: var(--mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 5px; }
.facets dd { margin: 0; display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.facets .chip { padding: 2px 9px; font-size: 12px; white-space: normal; }
.v-links { display: flex; gap: 8px; flex-wrap: wrap; }
.v-links .btn { padding: 6px 12px; font-size: 13px; }
.v-src { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin: 0; }
.v-src code { font-family: var(--mono); font-size: 12px; color: var(--fg); }

.copybox { width: 100%; min-height: 140px; font-family: var(--mono); font-size: 12px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); border-radius: var(--radius); padding: 8px 16px; font-size: 13px; z-index: 50;
}

@media (max-width: 980px) {
  .v-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-top: 14px; }
  .mark-name { font-size: 24px; }
  .top-actions { width: 100%; }
  .filters-btn { display: inline-flex; }
  .side {
    display: none; position: fixed; inset: 0; z-index: 40; max-height: none; background: var(--bg);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .side.open { display: flex; }
  .side-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); padding-bottom: 8px; z-index: 1; }
  .facets { grid-template-columns: minmax(0, 1fr); }
  .facets dt { padding-top: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<!-- @head-end -->
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="mark" href="#" id="home">
      <span class="mark-name">Set-Piece <b>Vault</b></span>
      <span class="mark-sub" id="markSub">Reference library</span>
    </a>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      <span class="sr">Search scenes</span>
      <input id="q" type="search" autocomplete="off" placeholder="Film, period, choreographer, keyword…">
      <kbd>/</kbd>
    </label>
    <div class="top-actions">
      <button class="btn filters-btn" id="filtersBtn" type="button">Filters <span class="count" id="filterCount">0</span></button>
      <button class="btn btn-primary" id="reelBtn" type="button">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.2v9.6L10.4 6z" fill="currentColor"/></svg>
        Play reel
      </button>
      <button class="btn" id="pullBtn" type="button" aria-pressed="false">Pull list <span class="count" id="pullCount">0</span></button>
    </div>
  </div>
</header>
<div class="hint" id="hint" hidden><p></p></div>

<div class="app">
  <aside class="side" id="side" aria-label="Filters">
    <div class="side-head">
      <strong>Filters</strong>
      <button class="btn" type="button" id="sideDone">Show results</button>
    </div>
    <div id="rail"></div>
  </aside>
  <main class="main">
    <div class="status">
      <h1 id="viewTitle">All scenes</h1>
      <span class="meta mono" id="viewMeta"></span>
      <span class="spacer"></span>
      <label><span class="sr">Sort</span>
        <select class="select" id="sort">
          <option value="curated">Sort: by scene type</option>
          <option value="tier">Sort: canon first</option>
          <option value="new">Sort: newest first</option>
          <option value="old">Sort: oldest first</option>
          <option value="story">Sort: story era</option>
          <option value="az">Sort: film A–Z</option>
          <option value="views">Sort: most watched clip</option>
        </select>
      </label>
    </div>
    <div class="active" id="active" hidden></div>
    <div id="copyWrap" hidden><textarea class="copybox" id="copyBox" readonly aria-label="Pull list text"></textarea></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No scenes match these filters. <button class="linkbtn" type="button" id="emptyClear">Clear filters</button></div>
  </main>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="vTitle">
  <div class="v-wrap">
    <div class="v-stage">
      <div class="screen" id="screen"></div>
      <div class="transport">
        <button class="btn" type="button" id="prevBtn" aria-label="Previous scene">◀ Prev</button>
        <button class="btn" type="button" id="replayBtn" aria-label="Replay the 30-second window">⟲ Replay</button>
        <button class="btn" type="button" id="loopBtn" aria-pressed="true">Loop</button>
        <button class="btn" type="button" id="nudgeBack" aria-label="Move window 5 seconds earlier">−5s</button>
        <button class="btn" type="button" id="nudgeFwd" aria-label="Move window 5 seconds later">+5s</button>
        <span class="grow"></span>
        <span class="reel" id="reelState"></span>
        <button class="btn" type="button" id="nextBtn" aria-label="Next scene">Next ▶</button>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="v-info" id="vInfo"></div>
  </div>
</dialog>
<div class="toast" id="toast" hidden></div>

<script src="clips/manifest.js" onerror="this.remove()"></script>
<script src="data/scenes.js"></script><!-- @data -->
<script>
(() => {
  "use strict";

  const DATA = window.SCENE_DATA || { taxonomy: {}, scenes: [] };
  const TAX = DATA.taxonomy;
  const SCENES = DATA.scenes;
  const LOCAL = window.LOCAL_CLIPS || {};
  const THUMBS = window.SCENE_THUMBS || null;
  const FILE_MODE = location.protocol === "file:";
  const MODE = window.SL_MODE || (FILE_MODE ? "link" : "embed");
  const CLIP = 30;

  const FAMILIES = [
    { key: "fight", label: "Fight", color: "var(--fight)", types: ["fight.hand_to_hand", "fight.blades", "fight.gunfight", "fight.ring_sport", "fight.superpowered", "fight.creature"] },
    { key: "battle", label: "Battle", color: "var(--battle)", types: ["battle.pre_gunpowder", "battle.black_powder", "battle.modern_ground", "battle.air", "battle.naval", "battle.space", "battle.giants"] },
    { key: "pursuit", label: "Chase & race", color: "var(--pursuit)", types: ["chase.vehicle", "chase.foot", "chase.air", "race"] },
    { key: "spectacle", label: "Stunts & spectacle", color: "var(--spectacle)", types: ["stunt.set_piece", "vfx.showcase", "disaster", "creature.attack", "space.travel"] },
  ];
  const TYPE_LABEL = {
    "fight.hand_to_hand": "Hand-to-hand & martial arts", "fight.blades": "Swords & blades", "fight.gunfight": "Gunfights & standoffs",
    "fight.ring_sport": "Ring & combat sports", "fight.superpowered": "Superpowered fights", "fight.creature": "Fighting creatures",
    "battle.pre_gunpowder": "Sword & spear battles", "battle.black_powder": "Musket & cannon battles", "battle.modern_ground": "Modern ground war",
    "battle.air": "Air combat", "battle.naval": "Naval combat", "battle.space": "Space battles", "battle.giants": "Kaiju, mechs & giants",
    "chase.vehicle": "Vehicle chases", "chase.foot": "Foot chases & parkour", "chase.air": "Air chases", "race": "Races",
    "stunt.set_piece": "Practical stunts", "vfx.showcase": "VFX showcases", "disaster": "Disasters", "creature.attack": "Creature attacks",
    "space.travel": "Space travel",
  };
  const TYPE_ORDER = FAMILIES.flatMap((f) => f.types);
  const FAMILY_OF = {};
  FAMILIES.forEach((f) => f.types.forEach((t) => (FAMILY_OF[t] = f)));
  const RAIL_FACETS = ["tier", "genre", "era", "region", "environment", "combatants", "weapons", "vehicles", "mood", "atmosphere",
    "time_of_day", "scale", "format", "technique", "look", "violence", "language", "medium"];
  const DETAIL_FACETS = ["scene_type", "tier", "format", "scale", "genre", "era", "region", "environment", "time_of_day", "atmosphere",
    "mood", "combatants", "weapons", "vehicles", "technique", "look", "violence", "language", "medium"];
  const ERA_ORDER = Object.keys(TAX.era ? TAX.era.values : {});
  const WINDOW_LABEL = { most_replayed: "Most-replayed window", motion_peak: "Busiest 30 s by motion", hand_picked: "Hand-picked window", estimated: "Estimated window" };
  const LABEL = {
    canon: "Canon", excellent: "Excellent", replaceable: "Replaceable",
    ww2: "WW2", usa: "USA", "19th_century": "19th century", early_20th_century: "Early 20th century", mid_20th_century: "Mid 20th century",
    late_20th_century: "Late 20th century", cgi: "CGI", pov: "POV", imax_large_format: "IMAX / large format", animation_2d: "2D animation",
    animation_3d: "3D animation", live_action_color: "Live action, colour", live_action_bw: "Live action, black & white",
    samurai_jidaigeki: "Samurai / jidaigeki", sci_fi: "Sci-fi", none_or_minimal: "No dialogue", not_applicable: "No time of day",
    ww1_soldiers: "WW1 soldiers", ww2_soldiers: "WW2 soldiers", jedi_sith: "Jedi & Sith", one_on_one: "One on one", one_vs_many: "One vs many",
    hong_kong: "Hong Kong", eastern_europe: "Eastern Europe", western_europe: "Western Europe", southern_europe: "Southern Europe",
    northern_europe: "Northern Europe", british_isles: "British Isles", latin_america: "Latin America", middle_east: "Middle East",
    north_africa: "North Africa", sub_saharan_africa: "Sub-Saharan Africa", south_asia: "South Asia", southeast_asia: "Southeast Asia",
    central_asia: "Central Asia", american_frontier: "American frontier", earth_orbit: "Earth orbit",
    apartment_house: "Apartment / house",
    apes_animals: "Apes / animals",
    artillery_cannon: "Artillery / cannon",
    ashigaru_japanese_army: "Ashigaru / Japanese army",
    assassins_hitmen: "Assassins / hitmen",
    axe_mace: "Axe / mace",
    bow_arrow: "Bow / arrow",
    boxers_fighters: "Boxers / fighters",
    castle_fortress: "Castle / fortress",
    chariot_carriage: "Chariot / carriage",
    claws_teeth: "Claws / teeth",
    cliff_canyon: "Cliff / canyon",
    cold_war_soldiers: "Cold War soldiers",
    cowboys_gunslingers: "Cowboys / gunslingers",
    crusaders_saracens: "Crusaders / saracens",
    dam_industrial: "Dam / industrial",
    debris_sparks: "Debris / sparks",
    dojo_gym: "Dojo / gym",
    drivers_racers: "Drivers / racers",
    dust_sand: "Dust / sand",
    fog_mist: "Fog / mist",
    heat_sun: "Heat / sun",
    hills_mountains: "Hills / mountains",
    imperial_chinese_army: "Imperial Chinese army",
    kaiju_giant_monsters: "Kaiju / giant monsters",
    kung_fu_fighters: "Kung fu fighters",
    mall_store: "Mall / store",
    market_bazaar: "Market / bazaar",
    martial_artists_modern: "Modern martial artists",
    mech_walker: "Mech / walker",
    mongol_steppe_warriors: "Mongol / steppe warriors",
    musket_flintlock: "Musket / flintlock",
    mutants_superpowered: "Mutants / superpowered",
    native_warriors: "Indigenous warriors",
    nightclub_bar: "Nightclub / bar",
    outlaws_bandits: "Outlaws / bandits",
    palace_mansion: "Palace / mansion",
    parachute_wingsuit: "Parachute / wingsuit",
    plaza_square: "Plaza / square",
    restaurant_kitchen: "Restaurant / kitchen",
    river_lake: "River / lake",
    robots_androids: "Robots / androids",
    rocket_missile: "Rocket / missile",
    sabre_rapier: "Sabre / rapier",
    sailors_navy: "Sailors / navy",
    slum_shantytown: "Slum / shantytown",
    snow_ice: "Snow / ice",
    spear_polearm: "Spear / polearm",
    spies_secret_agents: "Spies / secret agents",
    stadium_racetrack: "Stadium / racetrack",
    staff_stick: "Staff / stick",
    storm_wind: "Storm / wind",
    strobe_flash: "Strobe / flash",
    stunt_hero: "Stunt hero",
    swamp_mud: "Swamp / mud",
    tank_armour: "Tank guns",
    tank_armoured: "Tanks / armoured vehicles",
    temple_church: "Temple / church",
    thugs_henchmen: "Thugs / henchmen",
    torpedo_depth_charge: "Torpedoes / depth charges",
    triads_yakuza: "Triads / yakuza",
    tunnel_sewer: "Tunnel / sewer",
    warehouse_factory: "Warehouse / factory",
    wuxia_swordsmen: "Wuxia swordsmen",
    zombies_infected: "Zombies / infected",
  };
  const label = (facet, v) => facet === "scene_type" ? TYPE_LABEL[v] || v : LABEL[v] || (v.charAt(0).toUpperCase() + v.slice(1)).replace(/_/g, " ");
  const describe = (facet, v) => (TAX[facet] && TAX[facet].values[v]) || "";

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fold = (s) => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const arr = (v) => (Array.isArray(v) ? v : v == null || v === "" ? [] : [v]);
  const clock = (sec) => {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  };
  const thumbOf = (vid) => (THUMBS && THUMBS[vid]) || `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
  const watchUrl = (vid, t) => `https://www.youtube.com/watch?v=${vid}&t=${Math.max(0, Math.floor(t))}s`;
  const searchUrl = (s) => `https://www.youtube.com/results?search_query=${encodeURIComponent(`${s.film} ${s.year} ${s.scene}`)}`;
  const awardOrg = (a) => a.split(":")[0].trim();

  SCENES.forEach((s, i) => {
    s.order = TYPE_ORDER.indexOf(s.scene_type) * 10000 + i;
    const tagText = DETAIL_FACETS.flatMap((f) => arr(s[f]).map((v) => label(f, v) + " " + v)).join(" ");
    s.hay = fold([s.film, s.scene, s.year, s.what_happens, s.what_to_study, s.period, s.keywords.join(" "), s.director,
      s.production_country, s.crew.join(" "), s.awards.join(" "), tagText].join(" "));
  });
  const BY_ID = Object.fromEntries(SCENES.map((s) => [s.id, s]));

  /* Per-viewer conveniences only: the pull list and the open filter sections. */
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };
  let pull = new Set(store.get("spv-pull", []).filter((id) => BY_ID[id]));
  const openSections = new Set(store.get("spv-open", ["tier", "genre", "era", "region"]));
  const expanded = new Set();

  const state = { f: {}, q: "", pullOnly: false, sort: "curated" };
  let list = [];

  /* ---------- Filtering ---------- */
  function matches(s, skip) {
    for (const facet in state.f) {
      if (facet === skip) continue;
      const want = state.f[facet];
      if (want.size && !arr(s[facet]).some((v) => want.has(v))) return false;
    }
    if (state.pullOnly && !pull.has(s.id)) return false;
    if (state.q) for (const w of fold(state.q).split(/\s+/).filter(Boolean)) if (!s.hay.includes(w)) return false;
    return true;
  }
  function countsFor(facet) {
    const c = {};
    for (const s of SCENES) if (matches(s, facet)) for (const v of arr(s[facet])) c[v] = (c[v] || 0) + 1;
    return c;
  }
  const selected = (facet) => state.f[facet] || (state.f[facet] = new Set());
  const filterCount = () => Object.values(state.f).reduce((n, set) => n + set.size, 0);
  const TIER_RANK = { canon: 0, excellent: 1, replaceable: 2 };
  const SORTS = {
    curated: (a, b) => a.order - b.order,
    tier: (a, b) => TIER_RANK[a.tier] - TIER_RANK[b.tier] || a.order - b.order,
    new: (a, b) => b.year - a.year || a.order - b.order,
    old: (a, b) => a.year - b.year || a.order - b.order,
    story: (a, b) => ERA_ORDER.indexOf(a.era) - ERA_ORDER.indexOf(b.era) || a.order - b.order,
    az: (a, b) => a.film.localeCompare(b.film) || a.year - b.year,
    views: (a, b) => (b.clip.source_views || 0) - (a.clip.source_views || 0),
  };

  /* ---------- Rendering: filter rail ---------- */
  function renderRail() {
    const types = countsFor("scene_type");
    const sel = selected("scene_type");
    const total = SCENES.filter((s) => matches(s, "scene_type")).length;
    let html = `<p class="rail-title">Scene type</p><div class="tree">
      <button class="fv fv-all" type="button" data-all="scene_type" aria-pressed="${!sel.size}"><span>All scene types</span><span class="n">${total}</span></button>`;
    for (const fam of FAMILIES) {
      const famTotal = fam.types.reduce((n, t) => n + (types[t] || 0), 0);
      const famOn = fam.types.every((t) => sel.has(t));
      html += `<div class="fam" style="--g:${fam.color}">
        <button class="fam-head" type="button" data-family="${fam.key}" aria-pressed="${famOn}"><span>${esc(fam.label)}</span><span class="n mono">${famTotal}</span></button>`;
      for (const t of fam.types) {
        const n = types[t] || 0;
        html += `<button class="fv${n ? "" : " zero"}" type="button" data-facet="scene_type" data-value="${t}" aria-pressed="${sel.has(t)}" title="${esc(describe("scene_type", t))}"><span>${esc(TYPE_LABEL[t])}</span><span class="n">${n}</span></button>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
    for (const facet of RAIL_FACETS) {
      const spec = TAX[facet];
      if (!spec) continue;
      const counts = countsFor(facet);
      const on = selected(facet);
      const values = Object.keys(spec.values)
        .filter((v) => counts[v] || on.has(v))
        .sort(facet === "tier" ? () => 0 : (a, b) => (on.has(b) - on.has(a)) || (counts[b] || 0) - (counts[a] || 0));
      if (!values.length) continue;
      const shown = expanded.has(facet) ? values : values.slice(0, 8);
      html += `<details class="facet" data-section="${facet}"${openSections.has(facet) || on.size ? " open" : ""}>
        <summary title="${esc(spec.description)}">${esc(spec.label)}${on.size ? `<span class="sel">${on.size}</span>` : ""}</summary>
        ${shown.map((v) => `<button class="fv" type="button" data-facet="${facet}" data-value="${esc(v)}" aria-pressed="${on.has(v)}" title="${esc(describe(facet, v))}"><span>${esc(label(facet, v))}</span><span class="n">${counts[v] || 0}</span></button>`).join("")}
        ${values.length > 8 ? `<button class="more" type="button" data-more="${facet}">${expanded.has(facet) ? "Show fewer" : `Show all ${values.length}`}</button>` : ""}
      </details>`;
    }
    $("#rail").innerHTML = html;
  }

  function renderActive() {
    const chips = [];
    for (const facet of DETAIL_FACETS) {
      for (const v of state.f[facet] || []) {
        chips.push(`<button class="chip on" type="button" data-remove="${facet}" data-value="${esc(v)}" title="${esc(describe(facet, v))}"><b>${esc(TAX[facet].label)}:</b> ${esc(label(facet, v))} <span class="x">✕</span></button>`);
      }
    }
    if (state.pullOnly) chips.push(`<button class="chip on" type="button" data-remove="pull"><b>Pull list</b> <span class="x">✕</span></button>`);
    if (chips.length) {
      chips.push(`<button class="linkbtn" type="button" data-clear>Clear all</button>`);
      if (state.pullOnly) chips.push(`<button class="linkbtn" type="button" id="copyBtn">Copy pull list</button>`);
    }
    $("#active").innerHTML = chips.join("");
    $("#active").hidden = !chips.length;
  }

  /* ---------- Rendering: cards ---------- */
  const STAR = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.2l1.75 3.6 3.95.55-2.87 2.77.7 3.93L7 10.2l-3.53 1.85.7-3.93L1.3 5.35l3.95-.55z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  const LAUREL = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5l1.3 2.7 3 .4-2.2 2.1.5 3L6 8.3 3.4 9.7l.5-3L1.7 4.6l3-.4z" fill="currentColor"/></svg>`;
  const PLAY = `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3v12l10-6z" fill="currentColor"/></svg>`;

  function awardText(s) {
    const orgs = [...new Set(s.awards.map(awardOrg))];
    const oscars = s.awards.filter((a) => /^oscar/i.test(a)).length;
    if (oscars) return `${oscars} Oscar${oscars > 1 ? "s" : ""}${orgs.length > 1 ? ` + ${orgs.length - 1} more` : ""}`;
    return orgs.length ? orgs[0] + (orgs.length > 1 ? ` + ${orgs.length - 1}` : "") : "";
  }
  function feel(s) {
    return [label("mood", s.mood[0]), s.time_of_day !== "not_applicable" ? label("time_of_day", s.time_of_day) : "",
      ...s.atmosphere.slice(0, 2).map((v) => label("atmosphere", v))].filter(Boolean).join(" · ").toLowerCase();
  }
  function cardHtml(s) {
    const fam = FAMILY_OF[s.scene_type] || FAMILIES[0];
    const award = awardText(s);
    return `<article class="card" style="--g:${fam.color}">
      <button class="thumb" type="button" data-open="${esc(s.id)}" aria-label="Play 30 seconds: ${esc(s.scene)}, ${esc(s.film)}">
        <img loading="lazy" decoding="async" src="${esc(thumbOf(s.clip.youtube_id))}" alt="">
        <span class="tag mono"><i></i>${esc(TYPE_LABEL[s.scene_type])}</span>
        ${LOCAL[s.id] ? `<span class="disk mono">On disk</span>` : ""}
        ${s.tier === "canon" ? `<span class="canon mono" title="Canon: a scene every filmmaker should know">Canon</span>` : ""}
        <span class="tc mono"><span class="pick${s.clip.window === "estimated" ? "" : " hot"}" title="${WINDOW_LABEL[s.clip.window]}"></span>${clock(s.clip.start)}–${clock(s.clip.end)}</span>
        <span class="play-ico">${PLAY}</span>
      </button>
      <div class="card-body">
        <h2 class="film">${esc(s.film)}<span class="yr">${s.year}</span></h2>
        <p class="scene">${esc(s.scene)}</p>
        <p class="period">${esc(s.period)}</p>
        <p class="feel">${esc(feel(s))}</p>
        <div class="card-foot">
          ${award ? `<span class="award mono" title="${esc(s.awards.join("\n"))}">${LAUREL}<span>${esc(award)}</span></span>` : ""}
          <button class="star" type="button" data-star="${esc(s.id)}" aria-pressed="${pull.has(s.id)}" aria-label="Add to pull list">${STAR}</button>
        </div>
      </div>
    </article>`;
  }

  function viewTitle() {
    if (state.pullOnly) return "Pull list";
    const types = [...(state.f.scene_type || [])];
    if (types.length === 1) return TYPE_LABEL[types[0]];
    const fam = FAMILIES.find((f) => f.types.length === types.length && f.types.every((t) => types.includes(t)));
    if (fam) return fam.label;
    return types.length ? `${types.length} scene types` : "All scenes";
  }

  function render() {
    list = SCENES.filter((s) => matches(s)).sort(SORTS[state.sort]);
    renderRail();
    renderActive();
    $("#grid").innerHTML = list.map(cardHtml).join("");
    $("#empty").hidden = list.length > 0;
    $("#viewTitle").textContent = viewTitle();
    $("#viewMeta").textContent = `${list.length} clip${list.length === 1 ? "" : "s"} · ${clock(list.length * CLIP)} of reference`;
    $("#pullCount").textContent = pull.size;
    $("#pullBtn").setAttribute("aria-pressed", state.pullOnly);
    $("#filterCount").textContent = filterCount();
    $("#reelBtn").hidden = MODE !== "embed" && !Object.keys(LOCAL).length;
    $("#reelBtn").disabled = !reelList().length;
    if (!state.pullOnly) $("#copyWrap").hidden = true;
  }

  function clearFilters() {
    state.f = {};
    state.q = "";
    state.pullOnly = false;
    $("#q").value = "";
    render();
  }

  /* ---------- Events: library ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-facet],[data-family],[data-all],[data-more],[data-remove],[data-clear],[data-open],[data-star],[data-only]");
    if (!t) return;
    const d = t.dataset;
    if (d.star !== undefined) { togglePull(d.star); return; }
    if (d.open !== undefined) { openScene(d.open, { reel: false }); return; }
    if (d.more !== undefined) { expanded.has(d.more) ? expanded.delete(d.more) : expanded.add(d.more); renderRail(); return; }
    if (d.only !== undefined) {
      state.f = { [d.only]: new Set([d.value]) };
      state.pullOnly = false;
      closeViewer();
    } else if (d.facet !== undefined) {
      const set = selected(d.facet);
      set.has(d.value) ? set.delete(d.value) : set.add(d.value);
    } else if (d.family !== undefined) {
      const fam = FAMILIES.find((f) => f.key === d.family);
      const set = selected("scene_type");
      const all = fam.types.every((x) => set.has(x));
      state.f.scene_type = all ? new Set() : new Set(fam.types);
    } else if (d.all !== undefined) {
      state.f[d.all] = new Set();
    } else if (d.remove !== undefined) {
      if (d.remove === "pull") state.pullOnly = false;
      else selected(d.remove).delete(d.value);
    } else if (d.clear !== undefined) {
      clearFilters();
      return;
    }
    render();
  });
  document.addEventListener("toggle", (e) => {
    const sec = e.target.dataset && e.target.dataset.section;
    if (!sec) return;
    e.target.open ? openSections.add(sec) : openSections.delete(sec);
    store.set("spv-open", [...openSections]);
  }, true);

  function togglePull(id) {
    pull.has(id) ? pull.delete(id) : pull.add(id);
    store.set("spv-pull", [...pull]);
    document.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach((b) => b.setAttribute("aria-pressed", pull.has(id)));
    $("#pullCount").textContent = pull.size;
    if (state.pullOnly) render();
  }

  let qTimer;
  $("#q").addEventListener("input", (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120);
  });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#pullBtn").addEventListener("click", () => { state.pullOnly = !state.pullOnly; render(); });
  $("#emptyClear").addEventListener("click", clearFilters);
  $("#home").addEventListener("click", (e) => { e.preventDefault(); clearFilters(); window.scrollTo({ top: 0 }); });
  $("#filtersBtn").addEventListener("click", () => $("#side").classList.add("open"));
  $("#sideDone").addEventListener("click", () => { $("#side").classList.remove("open"); window.scrollTo({ top: 0 }); });
  $("#reelBtn").addEventListener("click", () => { const r = reelList(); if (r.length) openScene(r[0].id, { reel: true }); });
  $("#active").addEventListener("click", async (e) => {
    if (!e.target.closest("#copyBtn")) return;
    const text = list.map((s) => `${s.film} (${s.year}) — ${s.scene} — ${s.clip.youtube_url}  [${s.id}]`).join("\n");
    try {
      await navigator.clipboard.writeText(text);
      toast(`Copied ${list.length} scene${list.length === 1 ? "" : "s"}`);
    } catch {
      $("#copyWrap").hidden = false;
      $("#copyBox").value = text;
      $("#copyBox").select();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("#q") && !$("#viewer").open) {
      e.preventDefault();
      $("#q").focus();
    }
  });

  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.hidden = true), 1800);
  }

  /* ---------- Viewer ---------- */
  const viewer = $("#viewer");
  const V = { scene: null, video: null, start: 0, end: 0, duration: 0, loop: true, reel: false, player: null, ticker: null, local: false };
  const canPlay = (s) => MODE === "embed" || Boolean(LOCAL[s.id]);
  const reelList = () => list.filter(canPlay);

  let ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise((resolve) => {
      if (window.YT && window.YT.Player) return resolve();
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { prev && prev(); resolve(); };
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    });
    return ytReady;
  }

  function openScene(id, opts = {}) {
    const s = BY_ID[id];
    if (!s) return;
    if (opts.reel !== undefined) V.reel = opts.reel;
    Object.assign(V, { scene: s, video: s.clip.youtube_id, start: s.clip.start, end: s.clip.end, duration: s.clip.source_duration, localFailed: false });
    if (!viewer.open) viewer.showModal();
    try { history.replaceState(null, "", "#" + s.id); } catch { /* sandboxed */ }
    renderInfo();
    loadScreen();
    renderTimeline();
    renderTransport();
  }
  function closeViewer() { if (viewer.open) viewer.close(); }
  viewer.addEventListener("close", () => {
    stopTicker();
    destroyPlayer();
    V.reel = false;
    $("#screen").innerHTML = "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch { /* sandboxed */ }
  });
  viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });

  function destroyPlayer() {
    if (V.player && V.player.destroy) { try { V.player.destroy(); } catch { /* already gone */ } }
    V.player = null;
  }
  function step(dir) {
    const pool = V.reel ? reelList() : list;
    if (!pool.length || !V.scene) return;
    let i = pool.findIndex((s) => s.id === V.scene.id);
    i = i < 0 ? 0 : (i + dir + pool.length) % pool.length;
    openScene(pool[i].id);
  }

  function renderTransport() {
    const yt = !V.local && MODE === "embed";
    $("#replayBtn").hidden = !(yt || V.local);
    $("#loopBtn").hidden = !(yt || V.local);
    $("#nudgeBack").hidden = $("#nudgeFwd").hidden = V.local;
    $("#loopBtn").setAttribute("aria-pressed", V.loop && !V.reel);
    $("#loopBtn").disabled = V.reel;
    const pool = V.reel ? reelList() : list;
    const i = pool.findIndex((s) => s.id === V.scene.id);
    $("#reelState").textContent = i < 0 ? "" : `${V.reel ? "REEL " : ""}${i + 1} / ${pool.length}`;
  }

  function loadScreen() {
    const s = V.scene;
    const screen = $("#screen");
    stopTicker();
    V.local = Boolean(LOCAL[s.id]) && !V.localFailed;
    if (V.local) {
      destroyPlayer();
      screen.innerHTML = `<video id="vid" src="${esc(LOCAL[s.id])}" controls autoplay playsinline></video>`;
      const vid = $("#vid");
      vid.loop = V.loop && !V.reel;
      vid.addEventListener("ended", () => { if (V.reel) step(1); });
      vid.addEventListener("error", () => { V.localFailed = true; loadScreen(); renderTransport(); });
      vid.addEventListener("timeupdate", () => movePlayhead(V.start + vid.currentTime));
      return;
    }
    if (MODE !== "embed") {
      screen.innerHTML = `<a class="poster" href="${esc(watchUrl(V.video, V.start))}" target="_blank" rel="noopener">
        <img src="${esc(thumbOf(V.video))}" alt="">
        <span class="cta"><b>${PLAY} Play on YouTube from ${clock(V.start)}</b><span class="mono">Watch to ${clock(V.end)} · 30 s window</span></span></a>`;
      return;
    }
    if (V.player && V.player.loadVideoById) {
      screen.querySelector(".screen-msg")?.remove();
      V.player.loadVideoById({ videoId: V.video, startSeconds: V.start, endSeconds: V.end });
      startTicker();
      return;
    }
    screen.innerHTML = `<div id="ytHost"></div>`;
    loadYT().then(() => {
      if (!viewer.open || V.scene !== s || V.local) return;
      V.player = new YT.Player("ytHost", {
        videoId: V.video,
        host: "https://www.youtube-nocookie.com",
        playerVars: { start: V.start, end: V.end, autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, origin: location.origin },
        events: {
          onReady: () => startTicker(),
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              if (V.reel) step(1);
              else if (V.loop) V.player.loadVideoById({ videoId: V.video, startSeconds: V.start, endSeconds: V.end });
            }
          },
          onError: (e) => showPlayerError(e.data),
        },
      });
    });
  }

  function showPlayerError(code) {
    const s = V.scene;
    const why = code === 100 ? "This upload was removed from YouTube." : code === 101 || code === 150 ? "The uploader doesn't allow this clip to play outside YouTube." : code === 153 ? "YouTube refused the embed. Open this page through a web server rather than as a file." : "YouTube couldn't play this clip here.";
    const alts = s.clip.alternates.filter((a) => a.youtube_id !== V.video);
    const msg = document.createElement("div");
    msg.className = "screen-msg";
    msg.innerHTML = `<p>${esc(why)}</p><div class="row">
      ${alts.map((a, i) => `<button class="btn" type="button" data-alt="${i}">Try another upload${a.channel ? " (" + esc(a.channel) + ")" : ""}</button>`).join("")}
      <a class="btn" href="${esc(watchUrl(V.video, V.start))}" target="_blank" rel="noopener">Open on YouTube</a>
      <a class="btn" href="${esc(searchUrl(s))}" target="_blank" rel="noopener">Search YouTube</a></div>`;
    msg.addEventListener("click", (e) => {
      const b = e.target.closest("[data-alt]");
      if (!b) return;
      const a = alts[+b.dataset.alt];
      Object.assign(V, { video: a.youtube_id, start: a.start || 0, end: (a.start || 0) + CLIP, duration: 0 });
      msg.remove();
      renderTimeline();
      V.player.loadVideoById({ videoId: V.video, startSeconds: V.start, endSeconds: V.end });
    });
    $("#screen").appendChild(msg);
    if (V.reel) setTimeout(() => { if (V.reel && V.scene === s) step(1); }, 2500);
  }

  function movePlayhead(t) {
    const d = V.duration;
    const head = document.getElementById("playhead");
    if (head && d) { head.setAttribute("x1", (t / d) * 1000); head.setAttribute("x2", (t / d) * 1000); }
  }
  function startTicker() {
    stopTicker();
    V.ticker = setInterval(() => {
      if (V.player && V.player.getCurrentTime) movePlayhead(V.player.getCurrentTime());
    }, 250);
  }
  function stopTicker() { clearInterval(V.ticker); V.ticker = null; }

  function renderTimeline() {
    const s = V.scene;
    const d = V.duration || s.clip.source_duration || V.end;
    const heat = V.video === s.clip.youtube_id ? s.clip.replay_heat || "" : "";
    const W = 1000, H = 38, base = 34;
    let area = "";
    if (heat && d) {
      const n = heat.length;
      const pts = [...heat].map((c, i) => `${((i + 0.5) / n) * W},${base - (+c / 9) * 26}`);
      area = `<path d="M0,${base} L${pts.join(" L")} L${W},${base} Z" fill="currentColor" opacity="0.28"/>
              <path d="M${pts.join(" L")}" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>`;
    }
    const x0 = d ? (V.start / d) * W : 0, x1 = d ? (Math.min(V.end, d) / d) * W : W;
    const kind = V.local ? "downloaded clip" : V.video === s.clip.youtube_id ? WINDOW_LABEL[s.clip.window].toLowerCase() : "estimated window";
    $("#timeline").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        ${area}
        <rect x="${x0}" y="2" width="${Math.max(4, x1 - x0)}" height="${base - 2}" fill="#f0b24a" opacity="0.22"/>
        <rect x="${x0}" y="${base - 1}" width="${Math.max(4, x1 - x0)}" height="3" fill="#f0b24a"/>
        <line id="playhead" x1="-10" x2="-10" y1="0" y2="${H}" stroke="#ece7dd" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="tl-labels mono"><span>00:00</span><span><b>${clock(V.start)}–${clock(V.end)}</b> ${kind}</span><span>${d ? clock(d) : ""}</span></div>`;
  }

  function renderInfo() {
    const s = V.scene;
    const fam = FAMILY_OF[s.scene_type] || FAMILIES[0];
    const sec = (title, body) => (body ? `<div class="v-sec"><h4>${title}</h4>${body}</div>` : "");
    const rows = DETAIL_FACETS.map((f) => {
      const vals = arr(s[f]);
      if (!vals.length) return "";
      const extra = f === "era" ? `<span class="chip" title="Exact setting">${esc(s.period)}</span>` : "";
      return `<dt>${esc(TAX[f].label)}</dt><dd>${vals.map((v) => `<button class="chip" type="button" data-only="${f}" data-value="${esc(v)}" title="${esc(describe(f, v))} Click to show every scene tagged this way.">${esc(label(f, v))}</button>`).join("")}${extra}</dd>`;
    }).join("");
    $("#vInfo").innerHTML = `
      <div class="v-top" style="--g:${fam.color}">
        <span class="v-tag mono"><i></i>${esc(fam.label)} / ${esc(TYPE_LABEL[s.scene_type])}</span>
        <button class="v-close" type="button" id="vClose" aria-label="Close viewer">✕</button>
      </div>
      <div>
        <p class="v-film">${esc(s.film)}<span class="yr">${s.year}</span></p>
        <h2 class="v-title" id="vTitle">${esc(s.scene)}</h2>
        <p class="v-sub">${esc([s.production_country, s.director && "Dir. " + s.director].filter(Boolean).join(" · "))}</p>
      </div>
      ${sec("What happens", `<p>${esc(s.what_happens)}</p>`)}
      ${sec("What to study", `<p>${esc(s.what_to_study)}</p>`)}
      ${sec("Tags", `<dl class="facets">${rows}<dt>Keywords</dt><dd>${s.keywords.map((k) => `<span class="chip">${esc(k)}</span>`).join("")}</dd></dl>`)}
      ${sec("Awards", s.awards.length ? `<ul class="v-list awards">${s.awards.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : "")}
      ${sec("Key crew", s.crew.length ? `<ul class="v-list">${s.crew.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : "")}
      <div class="v-links">
        <button class="btn" type="button" data-star="${esc(s.id)}" aria-pressed="${pull.has(s.id)}">${STAR} Pull list</button>
        <a class="btn" href="${esc(watchUrl(s.clip.youtube_id, s.clip.start))}" target="_blank" rel="noopener">Open on YouTube ↗</a>
        <a class="btn" href="${esc(searchUrl(s))}" target="_blank" rel="noopener">Find other uploads ↗</a>
      </div>
      <p class="v-src">Clip source: “${esc(s.clip.source_title)}” · ${esc(s.clip.source_channel)}${s.clip.source_views ? ` · ${Number(s.clip.source_views).toLocaleString("en-US")} views` : ""}<br>
        Scene id <code>${esc(s.id)}</code> · file <code>${esc(s.clip.file)}</code></p>`;
    $("#vClose").addEventListener("click", closeViewer);
  }

  $("#prevBtn").addEventListener("click", () => step(-1));
  $("#nextBtn").addEventListener("click", () => step(1));
  $("#replayBtn").addEventListener("click", () => {
    if (V.local) { const v = $("#vid"); if (v) { v.currentTime = 0; v.play(); } return; }
    V.player?.loadVideoById?.({ videoId: V.video, startSeconds: V.start, endSeconds: V.end });
  });
  $("#loopBtn").addEventListener("click", () => {
    V.loop = !V.loop;
    const v = $("#vid");
    if (v) v.loop = V.loop;
    renderTransport();
  });
  function nudge(by) {
    const max = Math.max(0, (V.duration || V.end) - CLIP);
    V.start = Math.min(max, Math.max(0, V.start + by));
    V.end = V.start + CLIP;
    renderTimeline();
    if (MODE === "embed") V.player?.loadVideoById?.({ videoId: V.video, startSeconds: V.start, endSeconds: V.end });
    else loadScreen();
  }
  $("#nudgeBack").addEventListener("click", () => nudge(-5));
  $("#nudgeFwd").addEventListener("click", () => nudge(5));
  viewer.addEventListener("keydown", (e) => {
    if (e.target.closest("input,select,textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "r") $("#replayBtn").click();
    else if (e.key === "s") togglePull(V.scene.id);
  });

  /* ---------- Boot ---------- */
  const total = SCENES.length;
  const onDisk = SCENES.filter((s) => LOCAL[s.id]).length;
  $("#markSub").textContent = `${total} scenes · ${clock(total * CLIP)} of 30-second reference${onDisk ? ` · ${onDisk} on disk` : ""}`;
  if (FILE_MODE && !window.SL_MODE && onDisk < total) {
    $("#hint").hidden = false;
    $("#hint p").innerHTML = onDisk
      ? `${onDisk} downloaded clips play here. The rest open on YouTube because this page was opened as a file: run <code>./serve.sh</code> and open <code>http://localhost:8000</code> to play them inline.`
      : `Clips open on YouTube because this page was opened as a file. Run <code>./serve.sh</code> and open <code>http://localhost:8000</code> for the built-in player, or download the clips with <code>python3 tools/download_clips.py</code> to play them offline.`;
  }
  render();
  const start = decodeURIComponent(location.hash.slice(1));
  if (BY_ID[start]) openScene(start);
})();
</script>
<!-- @artifact-end -->
</body>
</html>
